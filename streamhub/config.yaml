name: StreamHub
version: "3.0.1"
slug: "streamhub"
description: "Single Xtream login for multiple IPTV providers with health checks, automatic failover, stream proxy and EPG passthrough."
url: "https://github.com/robinmusch/StreamHub"

arch:
  - aarch64
  - amd64

startup: application
boot: auto
init: false

ports:
  8088/tcp: 8088

ports_description:
  8088/tcp: "StreamHub Xtream API"

watchdog: "http://[HOST]:[PORT:8088]/health"

options:
  public_host: ""
  servers: []
  server_username: ""
  server_password: ""
  proxy_username: "streamhub"
  proxy_access_key: ""

  provider_mode: "AUTO"
  forced_provider_priority: 0

  content_filter: "ALL"
  custom_marker: ""

  health_check_seconds: 900
  backup_health_check_seconds: 21600
  health_timeout_seconds: 8
  stream_read_timeout_seconds: 30

  epg_enabled: true
  epg_url: ""
  epg_timeout_seconds: 30

schema:
  public_host: str
  servers:
    - str
  server_username: str
  server_password: password
  proxy_username: str
  proxy_access_key: password

  provider_mode: "list(AUTO|FORCED)"
  forced_provider_priority: int

  content_filter: "list(ALL|NL|BE|DE|FR|UK|US|ES|IT|PT|TR|CUSTOM)"
  custom_marker: str

  health_check_seconds: int
  backup_health_check_seconds: int
  health_timeout_seconds: int
  stream_read_timeout_seconds: int

  epg_enabled: bool
  epg_url: str
  epg_timeout_seconds: int
