name: "StreamHub"
version: "1.0.0"
slug: "streamhub"
description: "Multi-provider IPTV hub with configurable content filtering, persistent caching and automatic failover."
url: "https://github.com/robinmusch/streamhub"

arch:
  - aarch64
  - amd64

startup: application
boot: auto
init: false

ports:
  8088/tcp: 8088

ports_description:
  8088/tcp: "StreamHub HTTP API"

watchdog: "http://[HOST]:[PORT:8088]/health"

options:
  public_host: ""

  servers: []

  server_username: ""
  server_password: ""
  proxy_access_key: ""

  content_filter: "ALL"
  custom_marker: ""

  # Cacheduur is instelbaar via de Home Assistant app-configuratie.
  tv_cache_hours: 24
  movies_cache_hours: 12
  series_cache_hours: 12

  health_check_seconds: 900
  backup_health_check_seconds: 21600
  health_timeout_seconds: 8

  series_workers: 1
  series_request_delay: 1.5

  epg_enabled: true
  epg_url: ""

schema:
  public_host: str

  servers:
    - str

  server_username: str
  server_password: password
  proxy_access_key: password

  content_filter: list(
    ALL|
    NL|
    BE|
    DE|
    FR|
    UK|
    US|
    ES|
    IT|
    PT|
    TR|
    CUSTOM
  )

  custom_marker: str

  tv_cache_hours: int
  movies_cache_hours: int
  series_cache_hours: int

  health_check_seconds: int
  backup_health_check_seconds: int
  health_timeout_seconds: int

  series_workers: int
  series_request_delay: float

  epg_enabled: bool
  epg_url: str
