name: StreamHub
version: "1.4.0"
slug: streamhub
description: IPTV StreamHub with provider selection, caching, failover, Series State and stream proxy
url: https://github.com/robinmusch/streamhub
startup: services
boot: auto
init: false
watchdog: http://127.0.0.1:8088/status

arch:
  - aarch64
  - amd64

ports:
  8088/tcp: 8088

ports_description:
  8088/tcp: StreamHub HTTP API

map:
  - type: data
    read_only: false

options:
  public_host: ""

  # Intentionally empty in the public repository.
  servers: []

  server_username: ""
  server_password: ""

  proxy_access_key: ""

  provider_mode: "AUTO"
  forced_provider_priority: 0

  content_filter: "ALL"
  custom_marker: ""

  tv_cache_hours: 24
  movies_cache_hours: 12
  series_cache_hours: 12

  health_check_seconds: 900
  backup_health_check_seconds: 21600
  health_timeout_seconds: 8

  stream_read_timeout_seconds: 30

  series_workers: 1
  series_request_delay: 1.5

  epg_enabled: true
  epg_url: ""

schema:
  public_host: str

  servers:
    - str

  server_username: password
  server_password: password

  proxy_access_key: password

  provider_mode: list(AUTO|FORCED)
  forced_provider_priority: int

  content_filter: list(ALL|NL|BE|DE|FR|UK|US|ES|IT|PT|TR|CUSTOM)
  custom_marker: str

  tv_cache_hours: int
  movies_cache_hours: int
  series_cache_hours: int

  health_check_seconds: int
  backup_health_check_seconds: int
  health_timeout_seconds: int

  stream_read_timeout_seconds: int

  series_workers: int
  series_request_delay: float

  epg_enabled: bool
  epg_url: str
