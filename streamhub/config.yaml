def api_categories(
    server,
    action,
):
    data = provider_json(
        server,
        action,
    )

    if not isinstance(
        data,
        list,
    ):
        return []

    return [
        item
        for item in data
        if isinstance(item, dict)
        and category_matches(item)
    ]


def api_streams(
    server,
    action,
    kind,
    category=None,
):
    data = provider_json(
        server,
        action,
    )

    if not isinstance(
        data,
        list,
    ):
        return []

    result = []

    for item in data:

        if not isinstance(
            item,
            dict,
        ):
            continue

        if not matches(item):
            continue

        if (
            category is not None
            and str(
                item.get(
                    "category_id",
                    "",
                )
            )
            != str(category)
        ):
            continue

        result.append(item)

        remember_stream(
            kind,
            item,
            server,
        )

    return result


def xtream_live(
    item,
    request,
):
    result = dict(item)

    result["stream_type"] = "live"

    result["direct_source"] = stream_url(
        request,
        "tv",
        item,
    )

    result["stream_id"] = str(
        item.get(
            "stream_id",
            "",
        )
    )

    return result


def xtream_vod(
    item,
    request,
):
    result = dict(item)

    result["stream_type"] = "movie"

    result["direct_source"] = stream_url(
        request,
        "movies",
        item,
    )

    return result


def xtream_series(item):
    result = dict(item)

    result.pop(
        "episodes",
        None,
    )

    result.pop(
        "seasons",
        None,
    )

    return result


def api_response(
    request,
    query,
):
    action = query.get(
        "action",
        [None],
    )[0]

    if not action:
        return xtream_profile(
            request
        )

    candidates = healthy_candidates()

    if not candidates:
        check_all()
        candidates = healthy_candidates()

    if not candidates:
        raise RuntimeError(
            "no_healthy_provider"
        )

    category = query.get(
        "category_id",
        [None],
    )[0]

    last_error = None

    for server in candidates:

        try:

            if action == "get_live_categories":
                return api_categories(
                    server,
                    action,
                )

            if action == "get_vod_categories":
                return api_categories(
                    server,
                    action,
                )

            if action == "get_series_categories":
                return api_categories(
                    server,
                    action,
                )

            if action == "get_live_streams":
                return [
                    xtream_live(
                        item,
                        request,
                    )
                    for item in api_streams(
                        server,
                        action,
                        "tv",
                        category,
                    )
                ]

            if action == "get_vod_streams":
                return [
                    xtream_vod(
                        item,
                        request,
                    )
                    for item in api_streams(
                        server,
                        action,
                        "movies",
                        category,
                    )
                ]

            if action == "get_series":

                data = api_streams(
                    server,
                    action,
                    "series",
                    category,
                )

                result = []

                for item in data:

                    remember_series(
                        item,
                        server,
                    )

                    result.append(
                        xtream_series(
                            item
                        )
                    )

                return result

            if action == "get_series_info":

                series_id = query.get(
                    "series_id",
                    [""],
                )[0]

                with MAP_LOCK:
                    meta = SERIES_MAP.get(
                        str(series_id)
                    )

                if not meta:
                    meta = {
                        "server": server,
                        "item": {
                            "series_id": series_id,
                            "name": "",
                        },
                    }

                target_server = (
                    meta.get("server")
                    if meta.get("server")
                    in candidates
                    else server
                )

                try:
                    details = provider_json(
                        target_server,
                        "get_series_info",
                        {
                            "series_id": series_id
                        },
                    )

                except Exception:

                    catalog = provider_json(
                        server,
                        "get_series",
                    )

                    series = find_match(
                        catalog,
                        meta.get(
                            "item",
                            {},
                        ),
                    )

                    if not series:
                        raise

                    if not series.get(
                        "series_id"
                    ):
                        raise RuntimeError(
                            "series_not_found"
                        )

                    details = provider_json(
                        server,
                        "get_series_info",
                        {
                            "series_id":
                                series[
                                    "series_id"
                                ]
                        },
                    )

                    meta = {
                        "server": server,
                        "item": series,
                    }

                if not isinstance(
                    details,
                    dict,
                ):
                    return {
                        "info": {},
                        "episodes": {},
                        "seasons": [],
                    }

                series_item = dict(
                    meta.get(
                        "item",
                        {},
                    )
                )

                series_item[
                    "series_id"
                ] = str(
                    series_item.get(
                        "series_id",
                        series_id,
                    )
                )

                episodes = details.get(
                    "episodes",
                    {},
                )

                output = {}

                if isinstance(
                    episodes,
                    dict,
                ):

                    for (
                        season_key,
                        values,
                    ) in episodes.items():

                        if not isinstance(
                            values,
                            list,
                        ):
                            continue

                        for episode in values:

                            if not isinstance(
                                episode,
                                dict,
                            ):
                                continue

                            if not episode.get(
                                "id"
                            ):
                                continue

                            episode = dict(
                                episode
                            )

                            episode.setdefault(
                                "season",
                                safe_int(
                                    season_key,
                                    0,
                                ),
                            )

                            remember_episode(
                                series_item,
                                episode,
                                target_server,
                            )

                            episode[
                                "direct_source"
                            ] = series_direct_url(
                                request,
                                series_item,
                                episode,
                            )

                            episode[
                                "container_extension"
                            ] = str(
                                episode.get(
                                    "container_extension",
                                    "ts",
                                )
                                or "ts"
                            )

                            output.setdefault(
                                str(
                                    episode[
                                        "season"
                                    ]
                                ),
                                [],
                            ).append(
                                episode
                            )

                return {
                    "info": details.get(
                        "info",
                        {},
                    ),
                    "episodes": output,
                    "seasons": details.get(
                        "seasons",
                        [],
                    ),
                }

            if action == "get_vod_info":

                vod_id = query.get(
                    "vod_id",
                    [""],
                )[0]

                with MAP_LOCK:
                    meta = SOURCE_MAP[
                        "movies"
                    ].get(
                        str(vod_id)
                    )

                if not meta:
                    return {}

                item = meta["item"]

                info = provider_json(
                    meta["server"],
                    "get_vod_info",
                    {
                        "vod_id": item.get(
                            "stream_id",
                            vod_id,
                        )
                    },
                )

                if isinstance(
                    info,
                    dict,
                ):

                    info.setdefault(
                        "movie_data",
                        {},
                    )

                    info[
                        "movie_data"
                    ][
                        "direct_source"
                    ] = stream_url(
                        request,
                        "movies",
                        item,
                    )

                return info

            if action == "get_short_epg":
                return {
                    "epg_listings": []
                }

            if action == "get_simple_data_table":
                return []

            return {
                "error":
                    "unsupported_action",
                "action": action,
            }

        except Exception as exc:

            last_error = exc

            LOG.warning(
                "API %s failed on %s: %s",
                action,
                server,
                type(exc).__name__,
            )

            continue

    raise (
        last_error
        or RuntimeError(
            "provider_unavailable"
        )
    )


def send_json(
    handler,
    code,
    data,
):
    body = json.dumps(
        data,
        ensure_ascii=False,
        separators=(",", ":"),
    ).encode()

    handler.send_response(code)

    handler.send_header(
        "Content-Type",
        "application/json; charset=utf-8",
    )

    handler.send_header(
        "Content-Length",
        str(len(body)),
    )

    handler.send_header(
        "Cache-Control",
        "no-store",
    )

    handler.end_headers()

    if handler.command != "HEAD":
        handler.wfile.write(body)


def proxy_stream(
    handler,
    kind,
    identifier,
    query,
):
    with MAP_LOCK:

        if kind == "series":

            meta = EPISODE_MAP.get(
                str(identifier)
            )

            if not meta:

                meta = {
                    "server": None,
                    "series": {
                        "series_id":
                            query.get(
                                "sid",
                                [""],
                            )[0],
                        "name":
                            query.get(
                                "sn",
                                [""],
                            )[0],
                    },
                    "episode": {
                        "id": identifier,
                        "season": safe_int(
                            query.get(
                                "s",
                                [0],
                            )[0]
                        ),
                        "episode_num": safe_int(
                            query.get(
                                "e",
                                [0],
                            )[0]
                        ),
                        "title":
                            query.get(
                                "t",
                                [""],
                            )[0],
                    },
                }

        else:
            meta = SOURCE_MAP[
                kind
            ].get(
                str(identifier)
            )

    if not meta:
        send_json(
            handler,
            404,
            {
                "error":
                    "stream_not_found"
            },
        )
        return

    candidates = healthy_candidates(
        meta.get("server")
    )

    if not candidates:
        check_all()

        candidates = healthy_candidates(
            meta.get("server")
        )

    range_header = handler.headers.get(
        "Range"
    )

    for server in candidates:

        try:

            if kind == "series":
                resolved = resolve_series_source(
                    meta,
                    server,
                )

            elif kind == "movies":
                resolved = resolve_vod_source(
                    meta,
                    server,
                )

            else:
                resolved = resolve_tv_source(
                    meta,
                    server,
                )

            if not resolved:
                continue

            source_id, extension = resolved

            url = upstream_stream_url(
                server,
                kind,
                source_id,
                extension,
            )

            headers = {
                "User-Agent":
                    f"{APP_NAME}/{APP_VERSION}",
                "Accept": "*/*",
                "Connection": "close",
            }

            if range_header:
                headers[
                    "Range"
                ] = range_header

            request = Request(
                url,
                headers=headers,
                method="GET",
            )

            response = urlopen(
                request,
                timeout=stream_timeout(),
            )

            handler.send_response(
                response.status
            )

            for header in (
                "Content-Type",
                "Content-Length",
                "Content-Range",
                "Accept-Ranges",
            ):
                value = response.headers.get(
                    header
                )

                if value:
                    handler.send_header(
                        header,
                        value,
                    )

            handler.send_header(
                "Cache-Control",
                "no-cache",
            )

            handler.end_headers()

            while True:

                chunk = response.read(
                    1024 * 64
                )

                if not chunk:
                    break

                handler.wfile.write(
                    chunk
                )

            return

        except Exception as exc:

            LOG.warning(
                "Stream failover %s on %s: %s",
                kind,
                server,
                type(exc).__name__,
            )

            continue

    send_json(
        handler,
        502,
        {
            "status": "error",
            "error":
                "provider_stream_unavailable",
        },
    )


class Handler(
    BaseHTTPRequestHandler
):

    server_version = (
        f"{APP_NAME}/{APP_VERSION}"
    )

    def log_message(
        self,
        fmt,
        *args,
    ):
        LOG.info(
            "%s - %s",
            self.address_string(),
            fmt % args,
        )

    def do_GET(self):

        parsed = urllib.parse.urlparse(
            self.path
        )

        path = parsed.path

        query = urllib.parse.parse_qs(
            parsed.query
        )

        if path == "/health":

            send_json(
                self,
                200,
                {
                    "status": "ok",
                    "application":
                        APP_NAME,
                    "version":
                        APP_VERSION,
                },
            )

            return

        if not authorized(query):

            send_json(
                self,
                401,
                {
                    "status":
                        "error",
                    "error":
                        "unauthorized",
                },
            )

            return

        if path == "/status":

            with STATE_LOCK:

                data = {
                    "application":
                        APP_NAME,
                    "version":
                        APP_VERSION,
                    "active_server":
                        STATE[
                            "active_server"
                        ],
                    "last_health_check":
                        STATE[
                            "last_health_check"
                        ],
                    "providers":
                        dict(
                            STATE[
                                "servers"
                            ]
                        ),
                    "cache":
                        "disabled",
                    "show_adult_content":
                        show_adult_content(),
                }

            send_json(
                self,
                200,
                data,
            )

            return

        if path == "/check-servers":

            check_all()

            with STATE_LOCK:
                send_json(
                    self,
                    200,
                    dict(STATE),
                )

            return

        if path == "/refresh":

            check_all()

            send_json(
                self,
                200,
                {
                    "ok": True,
                    "cache":
                        "disabled",
                    "active_server":
                        STATE[
                            "active_server"
                        ],
                },
            )

            return

        if path in (
            "/epg.xml",
            "/epg.xml.gz",
        ):

            epg_url = str(
                CONFIG.get(
                    "epg_url",
                    "",
                )
                or ""
            ).strip()

            if (
                not bool(
                    CONFIG.get(
                        "epg_enabled",
                        True,
                    )
                )
                or not epg_url
            ):

                send_json(
                    self,
                    404,
                    {
                        "error":
                            "epg_not_configured"
                    },
                )

                return

            try:

                status, headers, body = (
                    request_bytes(
                        epg_url,
                        safe_int(
                            CONFIG.get(
                                "epg_timeout_seconds",
                                30,
                            ),
                            30,
                        ),
                    )
                )

                if not 200 <= status < 300:
                    raise RuntimeError(
                        f"http_{status}"
                    )

                content_type = headers.get(
                    "Content-Type",
                    "application/octet-stream",
                )

                self.send_response(
                    status
                )

                self.send_header(
                    "Content-Type",
                    content_type,
                )

                self.send_header(
                    "Content-Length",
                    str(len(body)),
                )

                self.send_header(
                    "Cache-Control",
                    "no-store",
                )

                self.end_headers()

                if self.command != "HEAD":
                    self.wfile.write(
                        body
                    )

            except Exception as exc:

                send_json(
                    self,
                    502,
                    {
                        "error":
                            "epg_unavailable",
                        "detail":
                            type(exc).__name__,
                    },
                )

            return

        if path == "/player_api.php":

            try:

                send_json(
                    self,
                    200,
                    api_response(
                        self,
                        query,
                    ),
                )

            except Exception as exc:

                send_json(
                    self,
                    502,
                    {
                        "error":
                            "provider_unavailable",
                        "detail":
                            type(exc).__name__,
                    },
                )

            return

        if (
            path.startswith("/live/")
            or path.startswith("/movie/")
            or path.startswith("/series/")
        ):

            parts = path.strip(
                "/"
            ).split("/")

            kind = (
                "tv"
                if parts[0] == "live"
                else "movies"
                if parts[0] == "movie"
                else "series"
            )

            filename = parts[-1]

            identifier = filename.rsplit(
                ".",
                1,
            )[0]

            proxy_stream(
                self,
                kind,
                identifier,
                query,
            )

            return

        if path in (
            "/get.php",
            "/playlist.m3u",
            "/movies.m3u",
            "/series.m3u",
        ):

            send_json(
                self,
                410,
                {
                    "error":
                        "m3u_disabled",
                    "message":
                        "Use Xtream Codes API",
                },
            )

            return

        if path == "/":

            send_json(
                self,
                200,
                {
                    "application":
                        APP_NAME,
                    "version":
                        APP_VERSION,
                    "status":
                        "running",
                    "interface":
                        "Xtream Codes API",
                    "cache":
                        False,
                },
            )

            return

        send_json(
            self,
            404,
            {
                "error":
                    "not_found"
            },
        )


def health_loop():

    while True:

        try:
            check_all()

        except Exception as exc:

            LOG.error(
                "Health check failed: %s",
                exc,
            )

        time.sleep(
            max(
                60,
                safe_int(
                    CONFIG.get(
                        "health_check_seconds",
                        900,
                    ),
                    900,
                ),
            )
        )


def main():

    LOG.info(
        "Starting %s %s",
        APP_NAME,
        APP_VERSION,
    )

    LOG.info(
        "Providers: %s",
        ", ".join(
            servers()
        )
        or "none",
    )

    LOG.info(
        "Content cache: disabled"
    )

    LOG.info(
        "Adult content: %s",
        "enabled"
        if show_adult_content()
        else "disabled",
    )

    check_all()

    with STATE_LOCK:
        STATE["started"] = True

    threading.Thread(
        target=health_loop,
        name="streamhub-health",
        daemon=True,
    ).start()

    http = ThreadingHTTPServer(
        (
            HOST,
            PORT,
        ),
        Handler,
    )

    LOG.info(
        "Xtream API listening on %s:%d",
        HOST,
        PORT,
    )

    http.serve_forever()


if __name__ == "__main__":
    main()