name: StreamHub
version: "1.4.0"
slug: streamhub
description: IPTV StreamHub with provider selection, caching, failover, Series State and stream proxy
url: https://github.com/robinmusch/streamhub
startup: services
boot: auto
init: false
watchdog: http://127.0.0.1:8088/status

arch:
  - aarch64
  - amd64

ports:
  8088/tcp: 8088

ports_description:
  8088/tcp: StreamHub HTTP API

map:
  - type: data
    read_only: false

options:
  access_key: ""

  provider_mode: "AUTO"
  forced_provider_priority: 0

  providers: []

  content_filter:
    enabled: true
    countries:
      - NL
      - BE
      - DE
      - FR
      - UK
      - US
      - ES
      - IT
      - PT
      - TR
      - CUSTOM
      - ALL

  cache:
    enabled: true

    tv:
      enabled: true
      ttl_hours: 24

    movies:
      enabled: true
      ttl_hours: 12

    series:
      enabled: true
      ttl_hours: 12

  health_check_seconds: 900
  backup_health_check_seconds: 21600
  health_timeout_seconds: 8

  stream_proxy:
    enabled: true
    connect_timeout_seconds: 8
    read_timeout_seconds: 30
    chunk_size: 65536
    retry_failed_provider: true
    max_provider_retries: 0

  series_workers: 1
  series_request_delay: 1.5

  epg_enabled: true
  epg_url: ""

schema:
  access_key: password

  provider_mode: list(AUTO|FORCED)
  forced_provider_priority: int

  providers:
    - name: str
      priority: int
      url: str
      username: password
      password: password

  content_filter:
    enabled: bool
    countries:
      - str

  cache:
    enabled: bool

    tv:
      enabled: bool
      ttl_hours: int

    movies:
      enabled: bool
      ttl_hours: int

    series:
      enabled: bool
      ttl_hours: int

  health_check_seconds: int
  backup_health_check_seconds: int
  health_timeout_seconds: int

  stream_proxy:
    enabled: bool
    connect_timeout_seconds: int
    read_timeout_seconds: int
    chunk_size: int
    retry_failed_provider: bool
    max_provider_retries: int

  series_workers: int
  series_request_delay: float

  epg_enabled: bool
  epg_url: str
