def now():
    return int(time.time())


def safe_int(value, default=0):
    try:
        return int(value)
    except (TypeError, ValueError):
        return default


def servers():
    result = []

    for value in CONFIG.get("servers", []):
        value = str(value or "").strip()

        if not value:
            continue

        if not value.startswith(("http://", "https://")):
            value = "http://" + value

        value = value.rstrip("/")

        if value not in result:
            result.append(value)

    return result


def upstream_credentials():
    return (
        str(CONFIG.get("server_username", "") or ""),
        str(CONFIG.get("server_password", "") or ""),
    )


def proxy_username():
    return str(
        CONFIG.get(
            "proxy_username",
            "streamhub",
        )
        or "streamhub"
    )


def proxy_password():
    return str(
        CONFIG.get(
            "proxy_access_key",
            "",
        )
        or ""
    )


def public_base(request):
    configured = str(
        CONFIG.get(
            "public_host",
            "",
        )
        or ""
    ).strip()

    if configured:
        if not configured.startswith(
            ("http://", "https://")
        ):
            configured = "https://" + configured

        return configured.rstrip("/")

    host = request.headers.get(
        "Host",
        "",
    ).strip()

    proto = request.headers.get(
        "X-Forwarded-Proto",
        "http",
    ).split(",")[0].strip()

    if proto not in ("http", "https"):
        proto = "http"

    return f"{proto}://{host}".rstrip("/")


def authorized(query):
    key = proxy_password()

    if not key:
        return True

    supplied_key = query.get(
        "key",
        [""],
    )[0]

    username = query.get(
        "username",
        [""],
    )[0]

    password = query.get(
        "password",
        [""],
    )[0]

    return (
        supplied_key == key
        or (
            username == proxy_username()
            and password == key
        )
    )


def timeout():
    return max(
        2,
        safe_int(
            CONFIG.get(
                "health_timeout_seconds",
                8,
            ),
            8,
        ),
    )


def stream_timeout():
    return max(
        5,
        safe_int(
            CONFIG.get(
                "stream_read_timeout_seconds",
                30,
            ),
            30,
        ),
    )


def request_bytes(
    url,
    timeout_seconds=None,
    range_header=None,
):
    headers = {
        "User-Agent": f"{APP_NAME}/{APP_VERSION}",
        "Accept": "*/*",
        "Connection": "close",
    }

    if range_header:
        headers["Range"] = range_header

    request = Request(
        url,
        headers=headers,
        method="GET",
    )

    with urlopen(
        request,
        timeout=timeout_seconds or timeout(),
    ) as response:

        return (
            response.status,
            dict(response.headers),
            response.read(),
        )


def provider_url(
    server,
    action=None,
    extra=None,
):
    username, password = upstream_credentials()

    params = {
        "username": username,
        "password": password,
    }

    if action:
        params["action"] = action

    if extra:
        params.update(
            {
                str(key): str(value)
                for key, value in extra.items()
            }
        )

    return (
        server.rstrip("/")
        + "/player_api.php?"
        + urllib.parse.urlencode(params)
    )


def provider_json(
    server,
    action=None,
    extra=None,
):
    status, _, body = request_bytes(
        provider_url(
            server,
            action,
            extra,
        ),
        timeout(),
    )

    if not 200 <= status < 300:
        raise RuntimeError(
            f"http_{status}"
        )

    return json.loads(
        body.decode(
            "utf-8",
            "replace",
        )
    )


def health(server):
    started = time.monotonic()

    try:
        data = provider_json(server)

        info = (
            data.get(
                "user_info",
                {},
            )
            if isinstance(data, dict)
            else {}
        )

        status = str(
            info.get(
                "status",
                "active",
            )
            or "active"
        ).lower()

        online = (
            isinstance(data, dict)
            and status
            in {
                "active",
                "enabled",
                "",
            }
        )

        return {
            "online": online,
            "latency_ms": round(
                (
                    time.monotonic()
                    - started
                )
                * 1000,
                1,
            ),
            "reason": (
                None
                if online
                else "provider_inactive"
            ),
        }

    except Exception as exc:
        return {
            "online": False,
            "latency_ms": None,
            "reason": type(exc).__name__,
        }


def select_active():
    configured = servers()

    mode = str(
        CONFIG.get(
            "provider_mode",
            "AUTO",
        )
        or "AUTO"
    ).upper()

    forced = safe_int(
        CONFIG.get(
            "forced_provider_priority",
            0,
        ),
        0,
    )

    with STATE_LOCK:
        online = [
            (
                server,
                STATE["servers"].get(
                    server,
                    {},
                ),
            )
            for server in configured
            if STATE["servers"]
            .get(server, {})
            .get("online")
        ]

    if (
        mode == "FORCED"
        and 1 <= forced <= len(configured)
    ):
        candidate = configured[
            forced - 1
        ]

        if any(
            server == candidate
            for server, _ in online
        ):
            active = candidate
        else:
            active = (
                online[0][0]
                if online
                else None
            )

    else:
        online.sort(
            key=lambda item: (
                item[1].get(
                    "latency_ms"
                )
                if isinstance(
                    item[1].get(
                        "latency_ms"
                    ),
                    (int, float),
                )
                else 10**9,
                configured.index(
                    item[0]
                ),
            )
        )

        active = (
            online[0][0]
            if online
            else None
        )

    with STATE_LOCK:
        STATE["active_server"] = active

    return active


def check_all():
    configured = servers()

    if not configured:
        LOG.warning(
            "No IPTV providers configured"
        )

        with STATE_LOCK:
            STATE["active_server"] = None
            STATE["last_health_check"] = now()

        return

    for server in configured:
        result = health(server)

        with STATE_LOCK:
            STATE["servers"][server] = {
                **result,
                "last_check": now(),
            }

        index = configured.index(server) + 1

        if result["online"]:
            LOG.info(
                "P%d online (%sms)",
                index,
                result["latency_ms"],
            )
        else:
            LOG.warning(
                "P%d offline: %s",
                index,
                result["reason"],
            )

    active = select_active()

    with STATE_LOCK:
        STATE["last_health_check"] = now()

    LOG.info(
        "Active provider: %s",
        active or "none",
    )


def healthy_candidates(preferred=None):
    configured = servers()

    with STATE_LOCK:
        online = {
            server: dict(
                STATE["servers"].get(
                    server,
                    {},
                )
            )
            for server in configured
        }

        active = STATE.get(
            "active_server"
        )

    candidates = [
        server
        for server in configured
        if online
        .get(server, {})
        .get("online")
    ]

    ordered = []

    for candidate in (
        preferred,
        active,
    ):
        if (
            candidate in candidates
            and candidate not in ordered
        ):
            ordered.append(candidate)

    rest = [
        server
        for server in candidates
        if server not in ordered
    ]

    rest.sort(
        key=lambda server:
        online[server].get(
            "latency_ms"
        )
        if isinstance(
            online[server].get(
                "latency_ms"
            ),
            (int, float),
        )
        else 10**9
    )

    return ordered + rest


def content_mode():
    return str(
        CONFIG.get(
            "content_filter",
            "ALL",
        )
        or "ALL"
    ).upper()


def marker():
    mode = content_mode()

    if mode == "CUSTOM":
        return str(
            CONFIG.get(
                "custom_marker",
                "",
            )
            or ""
        )

    return MARKERS.get(
        mode,
        "",
    )


def is_adult_category(item):
    if not isinstance(item, dict):
        return False

    text = " ".join(
        str(
            item.get(
                key,
                "",
            )
            or ""
        )
        for key in (
            "name",
            "category_name",
            "category",
            "group",
        )
    ).casefold()

    return any(
        marker in text
        for marker in ADULT_MARKERS
    )


def show_adult_content():
    return bool(
        CONFIG.get(
            "show_adult_content",
            False,
        )
    )


def matches(item):
    if is_adult_category(item):
        return show_adult_content()

    if content_mode() == "ALL":
        return True

    current_marker = marker().casefold()

    if not current_marker:
        return True

    if not isinstance(item, dict):
        return False

    text = " ".join(
        str(
            item.get(
                key,
                "",
            )
            or ""
        )
        for key in (
            "name",
            "category_name",
            "group",
            "category",
        )
    ).casefold()

    return current_marker in text


def category_matches(category):
    if not isinstance(category, dict):
        return False

    return matches(
        {
            "name": category.get(
                "category_name",
                "",
            )
        }
    )


