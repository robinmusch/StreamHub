    with MAP_LOCK:
        EPISODE_MAP[episode_id] = {
            "server": server,
            "series": dict(series),
            "episode": dict(episode),
        }


def find_match(
    items,
    target,
):
    target_name = " ".join(
        catalog_name(
            target
        ).casefold().split()
    )

    target_category = " ".join(
        category_name(
            target
        ).casefold().split()
    )

    exact = []
    fallback = []

    for item in (
        items
        if isinstance(items, list)
        else []
    ):
        if not isinstance(
            item,
            dict,
        ):
            continue

        item_name = " ".join(
            catalog_name(
                item
            ).casefold().split()
        )

        if item_name != target_name:
            continue

        fallback.append(item)

        item_category = " ".join(
            category_name(
                item
            ).casefold().split()
        )

        if (
            target_category
            and item_category
            == target_category
        ):
            exact.append(item)

    return (
        exact
        or fallback
        or [None]
    )[0]


def series_episode_match(
    details,
    source_episode,
):
    wanted_season = safe_int(
        source_episode.get(
            "season",
            0,
        ),
        0,
    )

    wanted_number = safe_int(
        source_episode.get(
            "episode_num",
            0,
        ),
        0,
    )

    wanted_title = " ".join(
        str(
            source_episode.get(
                "title",
                "",
            )
            or ""
        )
        .casefold()
        .split()
    )

    candidates = []

    episodes = (
        details.get(
            "episodes",
            {},
        )
        if isinstance(
            details,
            dict,
        )
        else {}
    )

    if not isinstance(
        episodes,
        dict,
    ):
        return None

    for season_key, values in episodes.items():

        if not isinstance(
            values,
            list,
        ):
            continue

        for episode in values:

            if not isinstance(
                episode,
                dict,
            ):
                continue

            season = safe_int(
                episode.get(
                    "season",
                    season_key,
                ),
                0,
            )

            number = safe_int(
                episode.get(
                    "episode_num",
                    0,
                ),
                0,
            )

            if (
                season
                == wanted_season
                and number
                == wanted_number
            ):
                candidates.append(
                    episode
                )

    if wanted_title:
        for episode in candidates:
            title = " ".join(
                str(
                    episode.get(
                        "title",
                        "",
                    )
                    or ""
                )
                .casefold()
                .split()
            )

            if title == wanted_title:
                return episode

    return (
        candidates[0]
        if candidates
        else None
    )


def resolve_series_source(
    meta,
    server,
):
    series = meta["series"]
    episode = meta["episode"]

    if server == meta.get("server"):
        return (
            str(
                episode.get(
                    "id",
                    "",
                )
            ),
            str(
                episode.get(
                    "container_extension",
                    "ts",
                )
                or "ts"
            ),
        )

    catalog = provider_json(
        server,
        "get_series",
    )

    target = find_match(
        catalog,
        series,
    )

    if not target:
        return None

    series_id = target.get(
        "series_id"
    )

    if not series_id:
        return None

    details = provider_json(
        server,
        "get_series_info",
        {
            "series_id": series_id
        },
    )

    found = series_episode_match(
        details,
        episode,
    )

    if not found:
        return None

    if not found.get("id"):
        return None

    return (
        str(found["id"]),
        str(
            found.get(
                "container_extension",
                "ts",
            )
            or "ts"
        ),
    )


def resolve_vod_source(
    meta,
    server,
):
    item = meta["item"]

    if server == meta.get("server"):
        return (
            str(
                item.get(
                    "stream_id"
                )
            ),
            str(
                item.get(
                    "container_extension",
                    "ts",
                )
                or "ts"
            ),
        )

    catalog = provider_json(
        server,
        "get_vod_streams",
    )

    found = find_match(
        catalog,
        item,
    )

    if not found:
        return None

    if not found.get("stream_id"):
        return None

    return (
        str(
            found["stream_id"]
        ),
        str(
            found.get(
                "container_extension",
                "ts",
            )
            or "ts"
        ),
    )


def resolve_tv_source(
    meta,
    server,
):
    item = meta["item"]

    if server == meta.get("server"):
        return (
            str(
                item.get(
                    "stream_id"
                )
            ),
            "ts",
        )

    catalog = provider_json(
        server,
        "get_live_streams",
    )

    found = find_match(
        catalog,
        item,
    )

    if not found:
        return None

    if not found.get("stream_id"):
        return None

    return (
        str(
            found["stream_id"]
        ),
        "ts",
    )


def upstream_stream_url(
    server,
    kind,
    source_id,
    extension,
):
    username, password = (
        upstream_credentials()
    )

    username = urllib.parse.quote(
        username,
        safe="",
    )

    password = urllib.parse.quote(
        password,
        safe="",
    )

    source_id = urllib.parse.quote(
        str(source_id),
        safe="",
    )

    extension = str(
        extension or "ts"
    ).lstrip(".")

    if kind == "tv":
        return (
            f"{server}/live/"
            f"{username}/"
            f"{password}/"
            f"{source_id}.ts"
        )

    if kind == "movies":
        return (
            f"{server}/movie/"
            f"{username}/"
            f"{password}/"
            f"{source_id}."
            f"{extension}"
        )

    return (
        f"{server}/series/"
        f"{username}/"
        f"{password}/"
        f"{source_id}."
        f"{extension}"
    )


def stream_url(
    request,
    kind,
    item,
):
    base = public_base(request)

    key = urllib.parse.urlencode(
        {
            "key": proxy_password()
        }
    ) if proxy_password() else ""

    stream_id = str(
        item.get(
            "stream_id",
            "",
        )
        or item.get(
            "series_id",
            "",
        )
    )

    extension = (
        "ts"
        if kind == "tv"
        else str(
            item.get(
                "container_extension",
                "ts",
            )
            or "ts"
        ).lstrip(".")
    )

    path_kind = (
        "live"
        if kind == "tv"
        else "movie"
        if kind == "movies"
        else "series"
    )

    url = (
        f"{base}/{path_kind}/"
        f"{urllib.parse.quote(stream_id, safe='')}"
        f".{extension}"
    )

    if key:
        url += "?" + key

    return url


def series_direct_url(
    request,
    series,
    episode,
):
    base = public_base(request)

    params = {
        "key": proxy_password(),
        "sid": series.get(
            "series_id",
            "",
        ),
        "s": episode.get(
            "season",
            0,
        ),
        "e": episode.get(
            "episode_num",
            0,
        ),
        "t": episode.get(
            "title",
            "",
        ),
    }

    params = {
        key: value
        for key, value in params.items()
        if value != ""
    }

    episode_id = str(
        episode.get(
            "id",
            "",
        )
    )

    extension = str(
        episode.get(
            "container_extension",
            "ts",
        )
        or "ts"
    ).lstrip(".")

    return (
        f"{base}/series/"
        f"{urllib.parse.quote(episode_id, safe='')}"
        f".{extension}?"
        f"{urllib.parse.urlencode(params)}"
    )


