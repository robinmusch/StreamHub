def load_config():
    config = dict(DEFAULT_CONFIG)

    try:
        if OPTIONS_FILE.exists():
            data = json.loads(
                OPTIONS_FILE.read_text(encoding="utf-8")
            )

            if isinstance(data, dict):
                config.update(data)

    except Exception as exc:
        LOG.error(
            "Unable to load configuration: %s",
            exc,
        )

    return config


CONFIG = load_config()


