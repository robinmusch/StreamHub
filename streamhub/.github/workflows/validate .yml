name: StreamHub Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Validate StreamHub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python syntax
        run: |
          python -m py_compile streamhub/app.py

      - name: Check Python import
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path("streamhub/app.py")
          source = path.read_text(encoding="utf-8")

          ast.parse(source, filename=str(path))

          print("Python AST validation: OK")
          PY

      - name: Check required files
        run: |
          test -f repository.yaml
          test -f streamhub/config.yaml
          test -f streamhub/Dockerfile
          test -f streamhub/run.sh
          test -f streamhub/app.py

      - name: Check Dockerfile
        run: |
          grep -q '^FROM ghcr.io/home-assistant/base:latest$' streamhub/Dockerfile
          grep -q '^EXPOSE 8088$' streamhub/Dockerfile

      - name: Check run.sh
        run: |
          test -x streamhub/run.sh || chmod +x streamhub/run.sh
          grep -q 'python3 /app/app.py' streamhub/run.sh

      - name: Check Home Assistant configuration
        run: |
          python - <<'PY'
          import yaml
          from pathlib import Path

          path = Path("streamhub/config.yaml")
          data = yaml.safe_load(path.read_text(encoding="utf-8"))

          required = [
              "name",
              "version",
              "slug",
              "arch",
              "startup",
              "boot",
              "ports",
              "options",
              "schema",
          ]

          missing = [key for key in required if key not in data]

          if missing:
              raise SystemExit(
                  f"Missing config keys: {', '.join(missing)}"
              )

          print("Home Assistant config validation: OK")
          PY

      - name: Check for obvious secrets
        run: |
          if grep -RniE \
            --exclude-dir=.git \
            --exclude='validate.yml' \
            'password[[:space:]]*:[[:space:]]*[^"]+|proxy_access_key[[:space:]]*:[[:space:]]*[^"]+' \
            streamhub repository.yaml; then
            echo "Possible hardcoded secret detected."
            exit 1
          fi

          echo "Secret scan: OK"
