name: Validate StreamHub

on:
  push:
    branches:
      - main
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate StreamHub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml

      - name: Validate Python syntax
        run: |
          python -m py_compile streamhub/app.py
          python -m compileall -q streamhub

      - name: Validate shell syntax
        run: |
          test -f streamhub/run.sh
          sh -n streamhub/run.sh

      - name: Validate repository files
        run: |
          test -f repository.yaml
          test -f streamhub/config.yaml
          test -f streamhub/Dockerfile
          test -f streamhub/run.sh
          test -f streamhub/app.py

      - name: Validate StreamHub configuration
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import sys
          import yaml

          root = Path(".")
          app_path = root / "streamhub" / "app.py"
          cfg_path = root / "streamhub" / "config.yaml"
          docker_path = root / "streamhub" / "Dockerfile"
          run_path = root / "streamhub" / "run.sh"
          repo_path = root / "repository.yaml"

          errors = []

          def error(message):
              errors.append(message)

          app_text = app_path.read_text(encoding="utf-8")
          docker_text = docker_path.read_text(encoding="utf-8")
          run_text = run_path.read_text(encoding="utf-8")
          repo_text = repo_path.read_text(encoding="utf-8")

          try:
              cfg = yaml.safe_load(cfg_path.read_text(encoding="utf-8"))
          except Exception as exc:
              error(f"config.yaml is invalid YAML: {exc}")
              cfg = {}

          if not isinstance(cfg, dict):
              error("config.yaml root must be a mapping")
              cfg = {}

          # ------------------------------------------------------------
          # Version: app.py is the source of truth.
          # ------------------------------------------------------------

          match = re.search(
              r'^\s*APP_VERSION\s*=\s*["\']([^"\']+)["\']',
              app_text,
              re.MULTILINE,
          )

          if not match:
              error("APP_VERSION not found in app.py")
              app_version = None
          else:
              app_version = match.group(1)

          if app_version and cfg.get("version") != app_version:
              error(
                  f"Version mismatch: app.py={app_version}, "
                  f"config.yaml={cfg.get('version')}"
              )

          # ------------------------------------------------------------
          # HA metadata
          # ------------------------------------------------------------

          expected_metadata = {
              "name": "StreamHub",
              "slug": "streamhub",
              "startup": "application",
              "boot": "auto",
              "init": False,
          }

          for key, expected in expected_metadata.items():
              if cfg.get(key) != expected:
                  error(
                      f"config.yaml: {key} must be {expected!r}; "
                      f"got {cfg.get(key)!r}"
                  )

          arches = set(cfg.get("arch", []))
          if not {"aarch64", "amd64"}.issubset(arches):
              error("config.yaml: arch must contain aarch64 and amd64")

          ports = cfg.get("ports", {})
          if ports.get("8088/tcp") != 8088:
              error("config.yaml: 8088/tcp must map to 8088")

          watchdog = str(cfg.get("watchdog", ""))
          if "/health" not in watchdog or "8088" not in watchdog:
              error("config.yaml: watchdog must target /health on port 8088")

          # ------------------------------------------------------------
          # Options must match the current app's DEFAULT_CONFIG.
          # This prevents config drift without hardcoding a release number.
          # ------------------------------------------------------------

          options = cfg.get("options")
          schema = cfg.get("schema")

          if not isinstance(options, dict):
              error("config.yaml: options must be a mapping")
              options = {}

          if not isinstance(schema, dict):
              error("config.yaml: schema must be a mapping")
              schema = {}

          required_options = {
              "public_host",
              "servers",
              "provider_mode",
              "forced_provider_priority",
              "server_username",
              "server_password",
              "proxy_access_key",
              "content_filter",
              "custom_marker",
              "tv_cache_hours",
              "movies_cache_hours",
              "series_cache_hours",
              "health_check_seconds",
              "backup_health_check_seconds",
              "health_timeout_seconds",
              "stream_read_timeout_seconds",
              "series_workers",
              "series_request_delay",
              "series_checkpoint_every",
              "series_pause_every",
              "series_pause_seconds",
              "epg_enabled",
              "epg_url",
              "epg_cache_hours",
              "epg_timeout_seconds",
          }

          missing_options = sorted(required_options - set(options))
          if missing_options:
              error(
                  "config.yaml missing options: "
                  + ", ".join(missing_options)
              )

          missing_schema = sorted(required_options - set(schema))
          if missing_schema:
              error(
                  "config.yaml missing schema entries: "
                  + ", ".join(missing_schema)
              )

          # These were deliberately removed in 2.0.8 and must not return.
          removed_options = {
              "cache_refresh_on_start",
              "series_state_rebuild_on_start",
          }

          present_removed = sorted(
              removed_options & (set(options) | set(schema))
          )

          if present_removed:
              error(
                  "Removed startup options are still present: "
                  + ", ".join(present_removed)
              )

          # ------------------------------------------------------------
          # Safe defaults / bounds
          # ------------------------------------------------------------

          if options.get("series_workers") != 1:
              print(
                  "INFO: series_workers is configurable; "
                  f"current default is {options.get('series_workers')}"
              )

          numeric_nonnegative = [
              "tv_cache_hours",
              "movies_cache_hours",
              "series_cache_hours",
              "health_check_seconds",
              "backup_health_check_seconds",
              "health_timeout_seconds",
              "stream_read_timeout_seconds",
              "series_workers",
              "series_request_delay",
              "series_checkpoint_every",
              "series_pause_every",
              "series_pause_seconds",
              "epg_cache_hours",
              "epg_timeout_seconds",
          ]

          for key in numeric_nonnegative:
              if key in options:
                  try:
                      if float(options[key]) < 0:
                          error(f"config.yaml: {key} must be >= 0")
                  except (TypeError, ValueError):
                      error(f"config.yaml: {key} must be numeric")

          if options.get("series_workers", 0) < 1:
              error("config.yaml: series_workers must be >= 1")

          # ------------------------------------------------------------
          # Dockerfile
          # ------------------------------------------------------------

          required_docker = [
              "FROM python:3.12-slim",
              "WORKDIR /app",
              "COPY run.sh /app/run.sh",
              "COPY app.py /app/app.py",
              "RUN chmod +x /app/run.sh",
              "EXPOSE 8088",
              'CMD ["/app/run.sh"]',
          ]

          for fragment in required_docker:
              if fragment not in docker_text:
                  error(f"Dockerfile missing: {fragment}")

          if re.search(
              r'io\.hass\.version\s*=\s*["\']',
              docker_text,
              re.IGNORECASE,
          ):
              error("Dockerfile must not contain a hardcoded app version")

          if re.search(
              r'StreamHub\s+\d+\.\d+\.\d+',
              docker_text,
              re.IGNORECASE,
          ):
              error("Dockerfile must not contain a hardcoded StreamHub version")

          # ------------------------------------------------------------
          # run.sh
          # ------------------------------------------------------------

          if not run_text.startswith("#!/bin/sh"):
              error("run.sh must start with #!/bin/sh")

          if "set -e" not in run_text:
              error("run.sh must contain 'set -e'")

          if "exec python3 /app/app.py" not in run_text:
              error("run.sh must execute /app/app.py")

          if re.search(
              r'StreamHub\s+\d+\.\d+\.\d+',
              run_text,
              re.IGNORECASE,
          ):
              error("run.sh must not contain a hardcoded StreamHub version")

          # ------------------------------------------------------------
          # repository.yaml
          # ------------------------------------------------------------

          if not repo_text.strip():
              error("repository.yaml is empty")

          # ------------------------------------------------------------
          # App implementation markers
          # ------------------------------------------------------------

          required_markers = [
              'APP_NAME = "StreamHub"',
              "ThreadingHTTPServer",
              "content_filter",
              "item_matches_content",
              "provider_mode",
              "select_active_server",
              "check_all_servers",
              "streamhub_id",
              "build_m3u",
              "player_api.php",
              "proxy_access_key",
              "/health",
              "/status",
              "/tv.m3u",
              "/movies.m3u",
              "/series.m3u",
              "/epg.xml",
              "startup_background_worker",
              "cache_is_fresh",
              "refresh_cache_type",
          ]

          for marker in required_markers:
              if marker not in app_text:
                  error(f"app.py missing implementation marker: {marker}")

          # ------------------------------------------------------------
          # Public repository must not contain provider endpoints/secrets.
          # ------------------------------------------------------------

          forbidden_hosts = [
              "line.tivi-ott.net",
              "line.cloud-ott.net",
              "line.hey-ott.net",
              "line.one-ott.xyz",
              "line.mytvtvone.com",
              "mag.hey-ott.net",
              "mag.one-ott.xyz",
              "mag.tivi-ott.net",
              "free-epg.de/api/epg/nl.xml.gz",
          ]

          for path in [
              app_path,
              cfg_path,
              docker_path,
              run_path,
              repo_path,
          ]:
              content = path.read_text(encoding="utf-8").lower()
              for host in forbidden_hosts:
                  if host.lower() in content:
                      error(
                          f"Forbidden provider/EPG endpoint {host} "
                          f"found in {path}"
                      )

          # ------------------------------------------------------------
          # Final result
          # ------------------------------------------------------------

          if errors:
              print("")
              print("======================================")
              print(" VALIDATION FAILED")
              print("======================================")
              for item in errors:
                  print(f" - {item}")
              sys.exit(1)

          print("")
          print("======================================")
          print(" VALIDATION PASSED")
          print("======================================")
          print(f"StreamHub version: {app_version}")
          print("Python syntax: OK")
          print("YAML: OK")
          print("HA metadata: OK")
          print("aarch64 + amd64: OK")
          print("Port 8088: OK")
          print("Watchdog: /health")
          print("Automatic cache lifecycle: OK")
          print("No forced startup rebuild settings: OK")
          print("No hardcoded provider endpoints: OK")
          print("No hardcoded Docker/run.sh version: OK")
          PY

      - name: Validate Dockerfile
        run: |
          grep -Fq 'FROM python:3.12-slim' streamhub/Dockerfile
          grep -Fq 'WORKDIR /app' streamhub/Dockerfile
          grep -Fq 'EXPOSE 8088' streamhub/Dockerfile
          grep -Fq 'CMD ["/app/run.sh"]' streamhub/Dockerfile

          if grep -Eq 'StreamHub[[:space:]]+[0-9]+\.[0-9]+\.[0-9]+' streamhub/Dockerfile; then
            echo "ERROR: Dockerfile contains a hardcoded StreamHub version"
            exit 1
          fi

      - name: Validate run.sh
        run: |
          sh -n streamhub/run.sh
          grep -Fq '#!/bin/sh' streamhub/run.sh
          grep -Fq 'set -e' streamhub/run.sh
          grep -Fq 'exec python3 /app/app.py' streamhub/run.sh

          if grep -Eq 'StreamHub[[:space:]]+[0-9]+\.[0-9]+\.[0-9]+' streamhub/run.sh; then
            echo "ERROR: run.sh contains a hardcoded StreamHub version"
            exit 1
          fi

      - name: Validation summary
        if: success()
        run: |
          echo "======================================"
          echo " StreamHub validation successful"
          echo "======================================"
          echo "Version is detected automatically from app.py."
          echo "No validation version update is required."
          echo "======================================"