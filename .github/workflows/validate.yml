name: StreamHub Validation

on:
  push:
    branches:
      - main
      - series-state

  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Validate StreamHub
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # Python
      # ------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ------------------------------------------------------------
      # Python syntax
      # ------------------------------------------------------------
      - name: Check Python syntax
        run: |
          python -m py_compile streamhub/app.py
          echo "Python syntax validation: OK"

      # ------------------------------------------------------------
      # Python AST
      # ------------------------------------------------------------
      - name: Check Python AST
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path("streamhub/app.py")
          source = path.read_text(encoding="utf-8")

          ast.parse(source, filename=str(path))

          print("Python AST validation: OK")
          PY

      # ------------------------------------------------------------
      # Required files
      # ------------------------------------------------------------
      - name: Check required files
        run: |
          test -f repository.yaml
          test -f streamhub/config.yaml
          test -f streamhub/Dockerfile
          test -f streamhub/run.sh
          test -f streamhub/app.py

          echo "Required files: OK"

      # ------------------------------------------------------------
      # Repository metadata
      # ------------------------------------------------------------
      - name: Check repository.yaml
        run: |
          grep -q '^name: StreamHub$' repository.yaml
          grep -q '^url: https://github.com/robinmusch/streamhub$' repository.yaml
          grep -q '^maintainer: Robin$' repository.yaml

          echo "repository.yaml validation: OK"

      # ------------------------------------------------------------
      # Dockerfile
      # ------------------------------------------------------------
      - name: Check Dockerfile
        run: |
          grep -q '^FROM python:3.12-slim$' streamhub/Dockerfile
          grep -q '^WORKDIR /app$' streamhub/Dockerfile
          grep -q '^EXPOSE 8088$' streamhub/Dockerfile
          grep -q '^CMD \["/app/run.sh"\]$' streamhub/Dockerfile

          grep -q 'COPY run.sh /app/run.sh' streamhub/Dockerfile
          grep -q 'COPY app.py /app/app.py' streamhub/Dockerfile
          grep -q 'chmod +x /app/run.sh' streamhub/Dockerfile

          echo "Dockerfile validation: OK"

      # ------------------------------------------------------------
      # run.sh
      # ------------------------------------------------------------
      - name: Check run.sh
        run: |
          test -x streamhub/run.sh

          grep -q '^#!/bin/sh$' streamhub/run.sh
          grep -q 'set -e' streamhub/run.sh
          grep -q 'python3 /app/app.py' streamhub/run.sh

          if grep -q 'with-contenv' streamhub/run.sh; then
            echo "ERROR: run.sh must not depend on with-contenv."
            exit 1
          fi

          if grep -q 'bashio' streamhub/run.sh; then
            echo "ERROR: run.sh must not depend on bashio."
            exit 1
          fi

          echo "run.sh validation: OK"

      # ------------------------------------------------------------
      # Install YAML validation dependency
      # ------------------------------------------------------------
      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyYAML

      # ------------------------------------------------------------
      # Home Assistant configuration
      # ------------------------------------------------------------
      - name: Check Home Assistant configuration
        run: |
          python - <<'PY'
          import yaml
          from pathlib import Path

          path = Path("streamhub/config.yaml")

          data = yaml.safe_load(
              path.read_text(encoding="utf-8")
          )

          if not isinstance(data, dict):
              raise SystemExit(
                  "config.yaml does not contain a YAML mapping"
              )

          required = [
              "name",
              "version",
              "slug",
              "description",
              "url",
              "arch",
              "startup",
              "boot",
              "init",
              "ports",
              "ports_description",
              "watchdog",
              "options",
              "schema",
          ]

          missing = [
              key
              for key in required
              if key not in data
          ]

          if missing:
              raise SystemExit(
                  "Missing config keys: "
                  + ", ".join(missing)
              )

          if data.get("name") != "StreamHub":
              raise SystemExit(
                  "config.yaml name must be StreamHub"
              )

          if data.get("slug") != "streamhub":
              raise SystemExit(
                  "config.yaml slug must be streamhub"
              )

          if data.get("version") != "2.0.1":
              raise SystemExit(
                  "config.yaml version must be 2.0.1"
              )

          if "aarch64" not in data.get("arch", []):
              raise SystemExit(
                  "aarch64 architecture is required"
              )

          if "amd64" not in data.get("arch", []):
              raise SystemExit(
                  "amd64 architecture is required"
              )

          if data.get("ports", {}).get("8088/tcp") != 8088:
              raise SystemExit(
                  "TCP port 8088 must be exposed"
              )

          required_options = [
              "public_host",
              "servers",
              "server_username",
              "server_password",
              "proxy_access_key",
              "provider_mode",
              "forced_provider_priority",
              "content_filter",
              "custom_marker",
              "tv_cache_hours",
              "movies_cache_hours",
              "series_cache_hours",
              "health_check_seconds",
              "backup_health_check_seconds",
              "health_timeout_seconds",
              "stream_read_timeout_seconds",
              "series_workers",
              "series_request_delay",
              "epg_enabled",
              "epg_url",
              "epg_cache_hours",
              "epg_timeout_seconds",
          ]

          options = data.get("options", {})

          missing_options = [
              key
              for key in required_options
              if key not in options
          ]

          if missing_options:
              raise SystemExit(
                  "Missing option keys: "
                  + ", ".join(missing_options)
              )

          schema = data.get("schema", {})

          missing_schema = [
              key
              for key in required_options
              if key not in schema
          ]

          if missing_schema:
              raise SystemExit(
                  "Missing schema keys: "
                  + ", ".join(missing_schema)
              )

          if options.get("content_filter") != "ALL":
              raise SystemExit(
                  "Default content_filter must be ALL"
              )

          allowed_filters = {
              "ALL",
              "NL",
              "BE",
              "DE",
              "FR",
              "UK",
              "US",
              "ES",
              "IT",
              "PT",
              "TR",
              "CUSTOM",
          }

          schema_filter = str(
              schema.get("content_filter", "")
          )

          for value in allowed_filters:
              if value not in schema_filter:
                  raise SystemExit(
                      f"content_filter schema is missing {value}"
                  )

          if "country_marker" in options:
              raise SystemExit(
                  "Old country_marker option must not exist"
              )

          if "country_marker" in schema:
              raise SystemExit(
                  "Old country_marker schema must not exist"
              )

          print(
              "Home Assistant configuration validation: OK"
          )
          PY

      # ------------------------------------------------------------
      # Default configuration values
      # ------------------------------------------------------------
      - name: Check StreamHub defaults
        run: |
          python - <<'PY'
          import yaml

          with open(
              "streamhub/config.yaml",
              "r",
              encoding="utf-8"
          ) as f:
              data = yaml.safe_load(f)

          options = data["options"]

          expected = {
              "provider_mode": "AUTO",
              "forced_provider_priority": 0,
              "content_filter": "ALL",
              "tv_cache_hours": 24,
              "movies_cache_hours": 12,
              "series_cache_hours": 12,
              "health_check_seconds": 900,
              "backup_health_check_seconds": 21600,
              "health_timeout_seconds": 8,
              "stream_read_timeout_seconds": 30,
              "series_workers": 1,
              "series_request_delay": 1.5,
              "epg_enabled": True,
              "epg_cache_hours": 6,
              "epg_timeout_seconds": 30,
          }

          for key, value in expected.items():
              actual = options.get(key)

              if actual != value:
                  raise SystemExit(
                      f"{key}: expected {value!r}, got {actual!r}"
                  )

          print("StreamHub default configuration: OK")
          PY

      # ------------------------------------------------------------
      # Public repository must contain no provider secrets
      # ------------------------------------------------------------
      - name: Check for hardcoded provider secrets
        run: |
          python - <<'PY'
          import yaml

          with open(
              "streamhub/config.yaml",
              "r",
              encoding="utf-8"
          ) as f:
              data = yaml.safe_load(f)

          options = data.get("options", {})

          if options.get("servers") not in ([], None):
              raise SystemExit(
                  "Provider servers must not be committed "
                  "to the public repository."
              )

          if options.get("server_username", "") not in ("", None):
              raise SystemExit(
                  "Provider username must not be committed "
                  "to the public repository."
              )

          if options.get("server_password", "") not in ("", None):
              raise SystemExit(
                  "Provider password must not be committed "
                  "to the public repository."
              )

          if options.get("proxy_access_key", "") not in ("", None):
              raise SystemExit(
                  "Proxy access key must not be committed "
                  "to the public repository."
              )

          print("Hardcoded secret validation: OK")
          PY

      # ------------------------------------------------------------
      # Provider URL scan
      # ------------------------------------------------------------
      - name: Check for provider URLs
        run: |
          if grep -RniE \
            --exclude-dir=.git \
            --exclude='validate.yml' \
            'https?://[^[:space:]"]*(line|mag)\.' \
            streamhub repository.yaml; then

            echo "Possible provider URL detected in repository."
            exit 1
          fi

          echo "Provider URL scan: OK"

      # ------------------------------------------------------------
      # Content filter implementation
      # ------------------------------------------------------------
      - name: Check StreamHub content filter implementation
        run: |
          grep -q 'content_filter' streamhub/app.py
          grep -q 'custom_marker' streamhub/app.py
          grep -q 'CONTENT_MARKERS' streamhub/app.py

          grep -q '"NL": "┃NL┃"' streamhub/app.py
          grep -q '"BE": "┃BE┃"' streamhub/app.py
          grep -q '"DE": "┃DE┃"' streamhub/app.py
          grep -q '"FR": "┃FR┃"' streamhub/app.py
          grep -q '"UK": "┃UK┃"' streamhub/app.py
          grep -q '"US": "┃US┃"' streamhub/app.py
          grep -q '"ES": "┃ES┃"' streamhub/app.py
          grep -q '"IT": "┃IT┃"' streamhub/app.py
          grep -q '"PT": "┃PT┃"' streamhub/app.py
          grep -q '"TR": "┃TR┃"' streamhub/app.py

          grep -q '"CUSTOM"' streamhub/app.py
          grep -q '"ALL"' streamhub/app.py

          echo "Content filter implementation validation: OK"

      # ------------------------------------------------------------
      # StreamHub version
      # ------------------------------------------------------------
      - name: Check StreamHub application version
        run: |
          grep -q 'APP_VERSION = "2.0.1"' streamhub/app.py

          echo "StreamHub application version: 2.0.1"

      # ------------------------------------------------------------
      # Required API routes
      # ------------------------------------------------------------
      - name: Check required API routes
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path(
              "streamhub/app.py"
          ).read_text(
              encoding="utf-8"
          )

          required_routes = [
              "/health",
              "/status",
              "/check-servers",
              "/refresh",
              "/cache",
              "/epg.xml",
              "/series-state",
              "/watchlist",
              "/new-episodes",
              "/watchlist/add",
              "/watchlist/remove",
              "/episode/watched",
              "/player_api.php",
              "/tv.m3u",
              "/movies.m3u",
              "/series.m3u",
              "/live/",
              "/movie/",
              "/series/",
          ]

          missing = [
              route
              for route in required_routes
              if route not in source
          ]

          if missing:
              raise SystemExit(
                  "Missing required routes: "
                  + ", ".join(missing)
              )

          print("Required API route validation: OK")
          PY

      # ------------------------------------------------------------
      # Authentication
      # ------------------------------------------------------------
      - name: Check authentication implementation
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path(
              "streamhub/app.py"
          ).read_text(
              encoding="utf-8"
          )

          required = [
              "proxy_access_key",
              "server_username",
              "server_password",
              "streamhub",
              "key",
          ]

          missing = [
              item
              for item in required
              if item not in source
          ]

          if missing:
              raise SystemExit(
                  "Missing authentication implementation: "
                  + ", ".join(missing)
              )

          print("Authentication implementation validation: OK")
          PY

      # ------------------------------------------------------------
      # Provider failover
      # ------------------------------------------------------------
      - name: Check provider failover implementation
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path(
              "streamhub/app.py"
          ).read_text(
              encoding="utf-8"
          )

          required = [
              "provider_mode",
              "forced_provider_priority",
              "AUTO",
              "FORCED",
              "latency",
              "failover",
              "health",
          ]

          missing = [
              item
              for item in required
              if item not in source
          ]

          if missing:
              raise SystemExit(
                  "Missing provider failover implementation: "
                  + ", ".join(missing)
              )

          print("Provider failover validation: OK")
          PY

      # ------------------------------------------------------------
      # Cache persistence
      # ------------------------------------------------------------
      - name: Check cache persistence implementation
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path(
              "streamhub/app.py"
          ).read_text(
              encoding="utf-8"
          )

          required = [
              "/data/cache",
              "tv_cache_hours",
              "movies_cache_hours",
              "series_cache_hours",
              "CACHE_FILES",
          ]

          missing = [
              item
              for item in required
              if item not in source
          ]

          if missing:
              raise SystemExit(
                  "Missing cache implementation: "
                  + ", ".join(missing)
              )

          print("Cache persistence validation: OK")
          PY

      # ------------------------------------------------------------
      # EPG
      # ------------------------------------------------------------
      - name: Check EPG implementation
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path(
              "streamhub/app.py"
          ).read_text(
              encoding="utf-8"
          )

          required = [
              "epg_enabled",
              "epg_url",
              "epg_cache_hours",
              "epg_timeout_seconds",
              "epg.xml",
              "gzip",
              "ElementTree",
          ]

          missing = [
              item
              for item in required
              if item not in source
          ]

          if missing:
              raise SystemExit(
                  "Missing EPG implementation: "
                  + ", ".join(missing)
              )

          print("EPG implementation validation: OK")
          PY

      # ------------------------------------------------------------
      # Final
      # ------------------------------------------------------------
      - name: Validation complete
        run: |
          echo "======================================"
          echo "StreamHub validation completed"
          echo "Version: 2.0.1"
          echo "======================================"
